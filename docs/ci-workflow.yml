name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: PHP Tests & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2.32.0
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, mbstring, json, session, filter
          coverage: none

      - name: Lint PHP Syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} +

      - name: Run Unit Tests
        run: |
          php tests/unit.php

      - name: Run HTTP Integration Tests
        run: |
          python3 tests/integration.py
